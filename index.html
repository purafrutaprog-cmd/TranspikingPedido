<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transpiking W.P. Global, S.L — Pedidos</title>

  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- Navegación por pestañas -->
<nav class="tabs no-print" aria-label="Navegación principal">
  <button class="tab active" data-tab="pedido" onclick="cambiarTab('pedido')">Pedido</button>
  <button class="tab" data-tab="hoja" onclick="cambiarTab('hoja')">Hoja de pedido</button>
  <div class="tab" onclick="cambiarTab('factura')">Factura</div>
  <button class="tab" data-tab="historial" onclick="cambiarTab('historial')">Historial</button>
</nav>

<!-- PEDIDO -->
<section id="tab-pedido" class="box" aria-labelledby="titulo-pedido">
  <h2 id="titulo-pedido">Pedido</h2>
  <input type="text" id="facturaNum" style="display:none">
  <input type="text" id="pedidoNum" style="display:none">
  <p class="muted">Rellena cliente, añade productos y luego genera hoja de pedido.</p>

  <h3>Cliente</h3>

  <label for="buscarCliente">Buscar cliente</label>
  <input type="text" id="buscarCliente" placeholder="Escribe dirección...">

  <label for="selCliente">Seleccionar cliente</label>
  <select id="selCliente">
    <option value="">Seleccionar cliente...</option>
  </select>

  <div class="row">
    <div>
      <label for="cliNombre">Nombre</label>
      <input id="cliNombre" placeholder="Nombre cliente">
    </div>

    <div>
      <label for="cliTelefono">Teléfono</label>
      <input id="cliTelefono" placeholder="Teléfono">
    </div>
  </div>

  <label for="cliDireccion">Dirección</label>
  <input id="cliDireccion" placeholder="Dirección cliente">

  <div class="row">
    <div>
      <label for="cliCP">Código postal</label>
      <input id="cliCP" placeholder="Código postal">
    </div>

    <div>
      <label for="cliCIF">CIF/NIF</label>
      <input id="cliCIF" placeholder="CIF/NIF">
    </div>
  </div>

  <label for="cliObs">Observaciones</label>
  <textarea id="cliObs" placeholder="Notas del pedido (opcional)"></textarea>

  <div class="btns">
    <button type="button" onclick="addCliente()" class="primary">Guardar cliente</button>
  </div>

  <div class="factura-opcion">
    <label>
  <input type="checkbox" id="requiereFactura">
  Requiere factura
</label>

<label style="display:block; margin-top:8px;">
  <input type="checkbox" id="facturaSimplificada">
  Factura simplificada
</label>

  </div>

  <h3>Añadir producto</h3>

  <div class="linea-add">
    <div>
      <label for="buscarProducto">Producto</label>
      <input type="text" id="buscarProducto" placeholder="Buscar producto..." autocomplete="off">
      <select id="selProducto"></select>
    </div>

    <div>
      <label for="selCantidad">Cantidad</label>
      <input id="selCantidad" type="number" min="1" value="1">
    </div>
  </div>

  <div class="btns no-print">
    <button class="ghost" onclick="addProducto()">Añadir producto</button>
    <button class="primary" onclick="finalizarPedido()">Finalizar pedido</button>
    <button class="danger" onclick="nuevoPedido()">Nuevo pedido</button>
  </div>

  <h3>Productos añadidos (editable)</h3>
  <div id="pedidoTabla" class="muted">Aún no hay productos añadidos.</div>
</section>

<!-- HOJA -->
<section id="tab-hoja" class="hidden box" aria-labelledby="titulo-hoja">
  <h2 id="titulo-hoja">Hoja de pedido</h2>



  <div id="printHoja"></div>

  <div class="btns no-print">
    <button class="print" onclick="window.print()">Imprimir / Descargar PDF</button>
    <button class="ghost" onclick="cambiarTab('pedido')">Volver</button>
    <button class="danger" onclick="nuevoPedido()">Nuevo pedido</button>
  </div>
</section>

<!-- HISTORIAL -->
<section id="tab-historial" class="hidden box" aria-labelledby="titulo-historial">
  <h2 id="titulo-historial">Historial de pedidos</h2>

  <div class="btns">
    <button onclick="descargarRuta('Ruta 1')">Descargar Ruta 1</button>
    <button onclick="descargarRuta('Ruta 2')">Descargar Ruta 2</button>
    <button onclick="descargarRuta('Pendiente')">Descargar Pendientes</button>
  </div>

  <div id="resumenDia" class="box"></div>

  <div class="btns no-print">
    <button class="print" onclick="window.print()">Descargar resumen PDF</button>
  </div>

  <div id="historialTabla">Cargando...</div>
</section>

<!-- FACTURA -->
<section id="tab-factura" class="hidden box" aria-labelledby="titulo-factura">
  <h1 id="titulo-factura" class="titulo-factura">Factura</h1>

  <div id="printFactura"></div>

  <div class="btns no-print">
    <button class="print" onclick="window.print()">Imprimir / Descargar PDF</button>
    <button class="ghost" onclick="cambiarTab('pedido')">Volver</button>
    <button class="danger" onclick="nuevoPedido()">Nuevo pedido</button>
    <button onclick="renderDocumento(false)">Ver hoja de pedido</button>
    <button onclick="renderDocumento(true)">Ver factura</button>
  </div>
</section>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/clientes.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/facturas.js"></script>
<script src="js/historial.js"></script>
<script src="js/app.js"></script>

</body>
</html>
