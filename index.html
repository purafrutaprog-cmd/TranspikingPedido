<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transpiking W.P. Global, S.L — Pedidos</title>

	<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- TABS -->
<div class="tabs no-print">
  <div class="tab active" data-tab="pedido" onclick="cambiarTab('pedido')">Pedido</div>
  <div class="tab" data-tab="hoja" onclick="cambiarTab('hoja')">Hoja de pedido</div>
  <div class="tab" data-tab="factura" onclick="cambiarTab('factura')">Factura</div>
  <div class="tab" data-tab="historial" onclick="cambiarTab('historial')">Historial</div>
</div>

<!-- PEDIDO -->
<section id="tab-pedido" class="box">
  <h2>Pedido</h2>
  <div class="muted">Rellena cliente, añade productos y luego genera hoja de pedido.</div>

  <h3 style="margin-top:14px">Cliente</h3>
<label>Buscar cliente</label>

<input
  type="text"
  id="buscarCliente"
  placeholder="Escribe dirección..."
>

<select id="selCliente">
  <option value="">Seleccionar cliente...</option>
</select>
  <div class="row">
    <div>
      <label>Nombre</label>
      <input id="cliNombre" placeholder="Nombre cliente">
    </div>
    <div>
      <label>Teléfono</label>
      <input id="cliTelefono" placeholder="Teléfono">
    </div>
  </div>

  <label>Dirección</label>
  <input id="cliDireccion" placeholder="Dirección cliente">

  <div class="row">
    <div>
      <label>Código postal</label>
      <input id="cliCP" placeholder="Código postal">
    </div>
    <div>
      <label>CIF/NIF</label>
      <input id="cliCIF" placeholder="CIF/NIF">
    </div>
  </div>

  <label>Observaciones</label>
  <textarea id="cliObs" placeholder="Notas del pedido (opcional)"></textarea>

<div class="btns">
  <button type="button" onclick="addCliente()" class="primary">
    Guardar cliente
  </button>
</div>
	
  <h3 style="margin-top:14px">Añadir producto</h3>

  <div class="linea-add">
    <div>
      <label>Producto</label>

		<input
  		type="text"
  		id="buscarProducto"
  		placeholder="Buscar producto...">

		<select id="selProducto" style="display:none">
        </select>
		
    </div>
    <div>
      <label>Cantidad</label>
      <input id="selCantidad" type="number" min="1" value="1">
    </div>
  </div>

  <div class="btns no-print">
    <button class="ghost" onclick="addProducto()">Añadir producto</button>
    <button class="primary" onclick="generarHoja()">Hoja de Pedido</button>
    <button class="danger" onclick="nuevoPedido()">Nuevo pedido</button>
  </div>

  <h3 style="margin-top:14px">Productos añadidos (editable)</h3>
  <div id="pedidoTabla" class="muted">Aún no hay productos añadidos.</div>
</section>

<!-- HOJA -->
<section id="tab-hoja" class="hidden box">
  <div class="box no-print">
  <label>Número de pedido</label>
  <input id="pedidoNum" readonly>

	  <label>Fecha del pedido</label>

		<input
  		type="date"
  		id="fechaPedido"
	  >
	  
  <label>Número de factura</label>
  <input id="facturaNum" placeholder="Ej: 2024-001">
	  <label style="margin-top:10px;display:flex;gap:8px;align-items:center">
  <input type="checkbox" id="requiereFactura">
  Este pedido requiere factura
</label>
  </div>
  <h2>Hoja de pedido</h2>
  <div id="printHoja"></div>

  <div class="btns no-print">
    <button class="print" onclick="window.print()">Imprimir / Descargar PDF</button>
    <button class="ghost" onclick="cambiarTab('pedido')">Volver</button>
    <button class="primary" onclick="generarFactura()">Ir a factura</button>
    <button class="danger" onclick="nuevoPedido()">Nuevo pedido</button>
  </div>
</section>

<!-- FACTURA -->
	<section id="tab-historial" class="hidden box">

  <h2>Historial de pedidos</h2>

<div id="resumenDia" class="box"></div>

<div class="btns no-print">
  <button class="print" onclick="window.print()">
    Descargar resumen PDF
  </button>
</div>
		
  <div id="historialTabla">
    Cargando...
  </div>

</section>
  <section id="tab-factura" class="hidden box">
  <div class="factura-header">
 <!-- <img src="logo.png" class="logo-titulo"> -->
  <h1 class="titulo-factura">FACTURA</h1>
</div>
  <div id="printFactura"></div>

  <div class="btns no-print">
    <button class="print" onclick="window.print()">Imprimir / Descargar PDF</button>
    <button class="ghost" onclick="cambiarTab('pedido')">Volver</button>
    <button class="danger" onclick="nuevoPedido()">Nuevo pedido</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/clientes.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/facturas.js"></script>
<script src="js/historial.js"></script>
<script src="js/app.js"></script>

</body>
</html>
